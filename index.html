  <style>
    /* Initial popup overlay */
    #initial-popup {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
    }

    #initial-popup .content {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      max-width: 90%;
      max-height: 90%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    #initial-popup .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 1.5rem;
      color: #333;
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>

<body>
  <div id="initial-popup">
    <div class="content">
      <button class="close-btn" aria-label="Close">&times;</button>
      <img src="./popup.png" alt="Bienvenidos"
        style="display:block;max-width:90vw;max-height:80vh;width:auto;height:auto;margin:auto;">
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const popup = document.getElementById('initial-popup');
      const closeBtn = popup.querySelector('.close-btn');
      closeBtn.addEventListener('click', () => popup.remove());
    });
  </script>
</body>
